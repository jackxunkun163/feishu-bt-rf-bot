name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt pytest
      - name: 单元 / 端到端测试（参数解析、修改、编译队列、崩溃恢复）
        run: python -m pytest -v tests
      - name: 示例配置可加载
        run: python -c "from btbot.config import load_config; load_config('config.example.yaml')"
